<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Регистрация</title>
</head>
<body>
    <h2>Создать аккаунт</h2>
    <!-- enctype="multipart/form-data" ОБЯЗАТЕЛЕН для передачи файлов! -->
    <form action="/api/registration/register" method="post" enctype="multipart/form-data">
        
        <div>
            <label>Имя пользователя (от 3 до 20 символов):</label><br />
            <input type="text" name="Username" required minlength="3" maxlength="20" />
        </div>

        <div>
            <label>Email:</label><br />
            <input type="email" name="Email" required />
        </div>

        <div>
            <label>Возраст (от 18 до 99):</label><br />
            <input type="number" name="Age" min="18" max="99" required />
        </div>

        <div>
            <label>Дата рождения:</label><br />
            <input type="date" name="BirthDate" required />
        </div>

        <div>
            <label>
                <input type="checkbox" name="SubscribeToNews" value="true" />
                Подписаться на новости
            </label>
        </div>

        <div>
            <label>Аватар (только .jpg, .png, до 2 МБ):</label><br />
            <input type="file" name="AvatarFile" accept=".jpg,.png" required />
        </div>

        <button type="submit">Зарегистрироваться</button>
    </form>
</body>
</html>
